
</div>

<div class="dots" id="dots"></div>
<div class="nav"><button id="prev" aria-label="Previous">&lsaquo;</button><span id="counter">1 / 1</span><button id="next" aria-label="Next">&rsaquo;</button></div>

<script>
/* ===== navigation — bound first so the mobile layer can wrap go() ===== */
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');d.addEventListener('click',()=>go(i));dots.appendChild(d);});
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;}
document.getElementById('next').addEventListener('click',e=>{e.stopPropagation();go(cur+1);});
document.getElementById('prev').addEventListener('click',e=>{e.stopPropagation();go(cur-1);});
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}});
/* Click anywhere to advance; the left 38% goes back. */
document.getElementById('deck').addEventListener('click',e=>{
  if(e.target.closest('a,button,.dot,.nav,iframe'))return;
  const r=document.getElementById('deck').getBoundingClientRect();
  go(cur + ((e.clientX-r.left) > r.width*0.38 ? 1 : -1));});
go(0);

/* ===== per-deck charts =====
   One IIFE per chart, each in its own try/catch so a bad chart can't take the
   navigation down with it. Draw into the <svg id="..."> inside that slide's
   .chartwrap, authoring in the SVG's own viewBox coordinates — the deck scaler
   handles fitting it to the screen. No chart library: the deck has to survive
   as one self-contained file with no network.

   The example below is wired to slides/05-chart.html. Replace it wholesale. */
try{(function(){
  const LABELS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
  const PLANNED=[6,14,25,38,52,68,84,100];
  const ACTUAL =[5,12,21,31,42,55,66,null];        // null = not yet reported

  const W=1000,H=470,mL=58,mR=40,mT=28,mB=48,pw=W-mL-mR,ph=H-mT-mB;
  const x=i=>mL+pw*i/(LABELS.length-1), y=v=>mT+ph-(v/100)*ph;
  const C_PLAN='#8aa0b4', C_ACT='#17546B', RED='#b3402f';
  const pts=a=>a.map((v,i)=>v==null?null:x(i).toFixed(1)+','+y(v).toFixed(1)).filter(Boolean).join(' ');

  let s='';
  for(let v=0;v<=100;v+=25){
    s+=`<line x1="${mL}" y1="${y(v)}" x2="${mL+pw}" y2="${y(v)}" stroke="#eef1f5"/>`;
    s+=`<text x="${mL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#9aa5b3">${v}%</text>`;
  }
  LABELS.forEach((l,i)=>{s+=`<text x="${x(i)}" y="${mT+ph+20}" text-anchor="middle" font-size="12" fill="#7b8798">${l}</text>`;});
  s+=`<polyline points="${pts(PLANNED)}" fill="none" stroke="${C_PLAN}" stroke-width="3"/>`;
  s+=`<polyline points="${pts(ACTUAL)}"  fill="none" stroke="${C_ACT}"  stroke-width="4"/>`;

  const last=ACTUAL.reduce((k,v,i)=>v==null?k:i,0);
  const gap=PLANNED[last]-ACTUAL[last];
  s+=`<line x1="${x(last)}" y1="${y(ACTUAL[last])}" x2="${x(last)}" y2="${y(PLANNED[last])}" stroke="${RED}" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<circle cx="${x(last)}" cy="${y(ACTUAL[last])}" r="5" fill="${C_ACT}"/>`;
  s+=`<text x="${x(last)-10}" y="${y((PLANNED[last]+ACTUAL[last])/2)+4}" text-anchor="end" font-size="13" font-weight="800" fill="${RED}">${gap} pts behind</text>`;
  document.getElementById('exampleChart').innerHTML=s;

  document.getElementById('exampleLegend').innerHTML=
    `<span><span class="sw" style="background:${C_PLAN}"></span>Planned</span>`+
    `<span><span class="sw" style="background:${C_ACT}"></span>Actual</span>`+
    `<span><span class="sw" style="background:${RED}"></span>Variance</span>`;
})();}catch(e){console.error('exampleChart',e);}
</script>
</body>
</html>

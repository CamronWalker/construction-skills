
  <!-- 1 TITLE — Westland cover template.
       cover.jpg carries the wordmark and chevron already; .tcover sits at 37%
       so deck titling clears them. Keep .tc-sub to one or two lines. -->
  <section class="slide title-slide active">
    <img class="tcover-bg" src="{{COVER}}" alt="Westland Construction">
    <div class="tcover">
      <div class="tc-kicker">{{KICKER}}</div>
      <h1 class="tc-h1">{{DECK_TITLE}}</h1>
      <div class="tc-sub">{{SUBTITLE}}</div>
      <div class="tc-meta">{{PRESENTER}} &nbsp;·&nbsp; {{DATE_LINE}}</div>
    </div>
  </section>


  <!-- 5 CHART — hand-built SVG, drawn by the matching IIFE in _99_tail.html.
       No chart library: the deck must stay a single self-contained file, and
       an artifact can't fetch a CDN. Author to the viewBox; the scaler fits it. -->
  <section class="slide">
    <div class="chead"><div><div class="eyebrow">{{EYEBROW}}</div><h2>{{SLIDE_HEADLINE}}</h2></div><img class="clogo" src="{{LOGO_DARK}}" alt="Westland"></div>
    <div class="crule"></div>
    <div class="cbody">
      <div class="chartwrap"><svg id="exampleChart" viewBox="0 0 1000 470" role="img" aria-label="Planned versus actual progress by month"></svg></div>
      <div class="legend" id="exampleLegend"></div>
      <div style="font-size:clamp(11px,1.05vw,14px);color:var(--muted);line-height:1.35;margin-top:8px">Footnote the source and the as-of date. If the numbers are illustrative, say so here — plainly.</div>
    </div>
    <div class="cfoot"><span>{{FOOTER_LEFT}}</span><span>{{PRESENTER}}</span></div>
  </section>

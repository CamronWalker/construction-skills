
  <!-- 4 SCREENSHOT — a real tool, shown. Swap the .dash placeholder below for
       the .shot block once the screenshot exists:

       <div class="shot"><img src="{{SCREENSHOT}}" alt="what it shows"></div>

       and add {{SCREENSHOT}} to assets/manifest.json. Keep the placeholder in
       the deck while you're waiting — an obviously-unfinished slide reads as
       honest; a missing slide reads as a gap in the argument. -->
  <section class="slide">
    <div class="chead"><div><div class="eyebrow">The work — live</div><h2>{{SLIDE_HEADLINE}}</h2></div><img class="clogo" src="{{LOGO_DARK}}" alt="Westland"></div>
    <div class="crule"></div>
    <div class="cbody">
      <div class="dash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 18v3"></path><path d="M6 13l3-3 3 2 4-5"></path>
        </svg>
        <div class="lbl">Screenshot placeholder</div>
        <div class="hint">Drop the real capture in here before the meeting. Full-window, no cursor, no personal data in view.</div>
      </div>
      <div class="dashcap"><b>What leadership asks it:</b> the question this screen answers — not a description of the screen.</div>
    </div>
    <div class="cfoot"><span>{{FOOTER_LEFT}}</span><span>{{PRESENTER}}</span></div>
  </section>

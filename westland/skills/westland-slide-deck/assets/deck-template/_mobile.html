<!-- ===== phone/tablet layer (additive) — fixed-canvas scaling + touch =====
     Injected before the final </body> by build_deck.py. Additive on purpose:
     it wraps the desktop nav rather than replacing it, so a change to one
     doesn't silently break the other.

     Canvas size is declared ONCE in --deck-w / --deck-h below; the CSS and the
     JS scaler both read it. Change it there and nowhere else. -->
<style>
  :root{ --deck-w:1600px; --deck-h:980px; --deck-scale:1; }
  html,body{ background:#0b1219; }

  /* Render at the full desktop canvas, then scale the whole deck uniformly to
     fit the screen. Nothing reflows, nothing clips, nothing hides — the phone
     sees the big-screen layout, just smaller. (Font clamps are pinned to their
     desktop values by the build, which is what makes this hold together.) */
  #deck{
    position:fixed; inset:auto; top:50%; left:50%;
    width:var(--deck-w); height:var(--deck-h);
    transform:translate(-50%,-50%) scale(var(--deck-scale));
    transform-origin:center center;
  }
  .slide{ width:var(--deck-w); height:var(--deck-h); }
  /* Never collapse multi-column layouts — we scale instead of reflowing. */
  .cols{ grid-template-columns:1fr 1fr; }

  /* ---- Rotate-to-landscape gate (phones/tablets held in portrait) ----
     A 16:9 deck scaled into a portrait phone is unreadable, so we don't try:
     portrait + coarse pointer gets a full-screen prompt instead. The coarse
     pointer test is what keeps this off narrow desktop windows. */
  #rotateHint{position:fixed;inset:0;z-index:999;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#0b1219;color:#eaf1f5;text-align:center;padding:32px;
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,sans-serif}
  #rotateHint svg{width:58px;height:58px;opacity:.92;animation:deckrot 2.6s ease-in-out infinite}
  #rotateHint .rh-t{font-size:19px;font-weight:800;letter-spacing:.01em}
  #rotateHint .rh-s{font-size:14px;color:#a9c4d4;max-width:22em;line-height:1.5}
  @keyframes deckrot{0%,52%{transform:rotate(0)}72%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){ #rotateHint{display:flex} }

  /* ---- First-view swipe affordance (touch + landscape only; auto-hides) ---- */
  #swipeHint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:none;
    background:rgba(23,84,107,.92);color:#fff;font-weight:800;letter-spacing:.14em;font-size:12px;
    padding:7px 16px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.32);pointer-events:none;
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,sans-serif;animation:deckpulse 1.8s ease-in-out infinite}
  @keyframes deckpulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (orientation:landscape) and (pointer:coarse){ #swipeHint{display:block} }
  #swipeHint.deck-hid{display:none!important}

  /* ---- Touch niceties: keep nav controls tappable ---- */
  @media (hover:none) and (pointer:coarse){
    html,body{-webkit-text-size-adjust:100%}
    .deck{touch-action:manipulation}   /* allow pinch-zoom; block double-tap-zoom */
    .nav button{width:44px;height:40px;font-size:20px}
    .dot{width:11px;height:11px}
    .nav,.dots{bottom:max(14px,env(safe-area-inset-bottom))}
  }

  /* ---- Directional transitions (the "sliding" feel on swipe/nav) ---- */
  .slide.active.deck-fwd{animation:deckin-r .32s cubic-bezier(.22,.61,.36,1)}
  .slide.active.deck-back{animation:deckin-l .32s cubic-bezier(.22,.61,.36,1)}
  @keyframes deckin-r{from{opacity:.35;transform:translate(-42%,-50%)}to{opacity:1;transform:translate(-50%,-50%)}}
  @keyframes deckin-l{from{opacity:.35;transform:translate(-58%,-50%)}to{opacity:1;transform:translate(-50%,-50%)}}
</style>

<div id="rotateHint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 19h2"></path>
  </svg>
  <div class="rh-t">Rotate to landscape</div>
  <div class="rh-s">Turn your phone sideways, then swipe left or right to move through the slides.</div>
</div>
<div id="swipeHint">&#8249; swipe &#8250;</div>

<script>
/* ===== scale-to-fit + touch (additive — leaves the desktop nav intact) ===== */
(function(){
  try{
    var deck=document.getElementById('deck');
    if(!deck) return;

    /* Read the canvas size from the CSS vars so there's one source of truth. */
    var cs=getComputedStyle(document.documentElement);
    var CW=parseFloat(cs.getPropertyValue('--deck-w'))||1600;
    var CH=parseFloat(cs.getPropertyValue('--deck-h'))||980;

    /* A host page may ship a viewport meta that blocks zoom. Readers on phones
       need pinch-zoom to inspect a dashboard screenshot, so re-enable it. */
    var vp=document.querySelector('meta[name="viewport"]');
    if(!vp){vp=document.createElement('meta');vp.setAttribute('name','viewport');(document.head||document.documentElement).appendChild(vp);}
    vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes');

    function fitDeck(){
      deck.style.setProperty('--deck-scale', Math.min(window.innerWidth/CW, window.innerHeight/CH));
    }
    fitDeck();
    window.addEventListener('resize', fitDeck, {passive:true});
    /* iOS reports stale dimensions during the rotation animation — wait it out. */
    window.addEventListener('orientationchange', function(){ setTimeout(fitDeck,60); });

    if(typeof go!=='function'||typeof slides==='undefined') return;

    var hint=document.getElementById('swipeHint');
    function killHint(){ if(hint) hint.classList.add('deck-hid'); }
    setTimeout(killHint,6000);

    /* Wrap go() so every move animates in the direction traveled. Buttons,
       dots, keys and tap-zones all call go() by name, so they inherit this. */
    var _go=go, suppressClick=false;
    go=function(n){
      var target=Math.max(0,Math.min(slides.length-1,n));
      var dir=target>cur?'deck-fwd':(target<cur?'deck-back':'');
      _go(target);
      if(dir){
        killHint();
        var a=document.querySelector('.slide.active');
        if(a){a.classList.remove('deck-fwd','deck-back');void a.offsetWidth;a.classList.add(dir);}
      }
    };

    /* A swipe must not ALSO fire the deck's tap-to-advance, or one gesture
       jumps two slides. Capture phase beats the bubble-phase tap handler. */
    deck.addEventListener('click',function(e){
      if(suppressClick){e.stopImmediatePropagation();e.preventDefault();suppressClick=false;}
    },true);

    var x0=null,y0=null;
    deck.addEventListener('touchstart',function(e){
      if(e.touches.length>1){x0=null;return;}   /* pinch, not swipe */
      var t=e.touches[0];x0=t.clientX;y0=t.clientY;
    },{passive:true});
    deck.addEventListener('touchend',function(e){
      if(x0===null)return;
      var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
      if(e.target.closest&&e.target.closest('a,button,.dot,iframe,input,textarea,select'))return;
      if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){
        go(cur+(dx<0?1:-1));
        suppressClick=true;setTimeout(function(){suppressClick=false;},450);
      }
    },{passive:true});
  }catch(err){console.error('deck mobile layer',err);}
})();
</script>

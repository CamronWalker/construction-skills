<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel   { fill: #26262b; stroke: #3a3a42; stroke-width: 1; }
      .frame   { fill: #f7f7f8; stroke: #d4d4d8; stroke-width: 1.5; }
      .row     { fill: #e8e8ea; font-size: 15px; }
      .rowmut  { fill: #a1a1aa; font-size: 15px; }
      .hi      { fill: #34343d; }
      .caret   { fill: #a1a1aa; font-size: 15px; }
      .caption { fill: #3f3f46; font-size: 15px; font-weight: 600; }
      .sub     { fill: #71717a; font-size: 12.5px; }
      .badge   { fill: #2563eb; }
      .bnum    { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .lead    { stroke: #2563eb; stroke-width: 2; fill: none; }
      .togON   { fill: #2563eb; }
      .togknob { fill: #ffffff; }
    </style>
  </defs>

  <!-- framing card -->
  <rect class="frame" x="8" y="8" width="804" height="544" rx="14"/>
  <text class="caption" x="32" y="42">Opening the connector manager</text>
  <text class="sub" x="32" y="64">Claude composer  →  +  →  Connectors  →  Manage connectors</text>

  <!-- ============ composer bar ============ -->
  <rect x="60" y="470" width="330" height="58" rx="12" fill="#ffffff" stroke="#d4d4d8"/>
  <!-- + button -->
  <circle cx="95" cy="499" r="16" fill="#ececf0" stroke="#c9c9cf"/>
  <line x1="95" y1="491" x2="95" y2="507" stroke="#3f3f46" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="87" y1="499" x2="103" y2="499" stroke="#3f3f46" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="122" y="487" width="70" height="24" rx="12" fill="#f0f0f2" stroke="#d4d4d8"/>
  <text class="sub" x="134" y="503">Cowork</text>

  <!-- ============ popover 1: + menu ============ -->
  <rect class="panel" x="60" y="250" width="250" height="176" rx="12"/>
  <text class="row"   x="82" y="286">Add files or photos</text>
  <text class="row"   x="82" y="322">Skills</text>
  <text class="caret" x="286" y="322" text-anchor="end">›</text>
  <!-- highlighted Connectors row -->
  <rect class="hi" x="68" y="336" width="234" height="30" rx="7"/>
  <text class="row"   x="82" y="357">Connectors</text>
  <text class="caret" x="286" y="357" text-anchor="end">›</text>
  <text class="row"   x="82" y="393">Plugins</text>

  <!-- ============ popover 2: connectors submenu ============ -->
  <rect class="panel" x="360" y="120" width="360" height="316" rx="12"/>
  <text class="row"   x="382" y="156">＋  Add connector</text>
  <text class="caret" x="696" y="156" text-anchor="end">›</text>
  <!-- highlighted Manage connectors row -->
  <rect class="hi" x="368" y="170" width="344" height="30" rx="7"/>
  <text class="row"   x="382" y="191">Manage connectors</text>
  <line x1="368" y1="214" x2="712" y2="214" stroke="#3a3a42" stroke-width="1"/>

  <!-- connector rows with toggles -->
  <g>
    <text class="rowmut" x="382" y="243">Context7</text>
    <rect class="togON" x="672" y="231" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="239" r="6"/>
    <text class="rowmut" x="382" y="273">Supabase</text>
    <rect class="togON" x="672" y="261" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="269" r="6"/>
    <text class="rowmut" x="382" y="303">Todoist</text>
    <rect class="togON" x="672" y="291" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="299" r="6"/>
    <text class="row"    x="382" y="333">Westland BuildingConnected</text>
    <rect class="togON" x="672" y="321" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="329" r="6"/>
    <text class="row"    x="382" y="363">Westland Buildr MCP</text>
    <rect class="togON" x="672" y="351" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="359" r="6"/>
    <text class="row"    x="382" y="393">Westland MCP</text>
    <rect class="togON" x="672" y="381" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="389" r="6"/>
    <text class="row"    x="382" y="423">Westland Procore MCP</text>
    <rect class="togON" x="672" y="411" width="30" height="16" rx="8"/><circle class="togknob" cx="694" cy="419" r="6"/>
  </g>

  <!-- ============ callouts ============ -->
  <!-- 1: + button -->
  <path class="lead" d="M 60 499 H 40"/>
  <circle class="badge" cx="26" cy="499" r="14"/>
  <text class="bnum" x="26" y="504" text-anchor="middle">1</text>

  <!-- 2: Connectors row -->
  <path class="lead" d="M 310 351 H 336"/>
  <circle class="badge" cx="336" cy="351" r="14"/>
  <text class="bnum" x="336" y="356" text-anchor="middle">2</text>

  <!-- 3: Manage connectors row -->
  <path class="lead" d="M 720 185 H 758"/>
  <circle class="badge" cx="772" cy="185" r="14"/>
  <text class="bnum" x="772" y="190" text-anchor="middle">3</text>
</svg>
